[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extstats2"
version = "0.1.0"
description = "Backend-agnostic budgeted selection of extended statistics (PostgreSQL / Oracle)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlglot>=25.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
extstats2 = "extstats2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extstats2 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
